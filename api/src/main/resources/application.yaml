spring:
  datasource:
    # Tenta ler a variável do Railway; se não existir, usa o fallback local
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/barberconnect}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Cria ou atualiza as tabelas automaticamente no Supabase
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  # O Railway vai injetar a porta automaticamente na nuvem através da variável PORT.
  # Localmente, a aplicação continuará a subir na porta 8080.
  port: ${PORT:8080}